<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="apairo">
  <title>apairo</title>
  <!-- the ochre database stands in front: cut a 6.5 halo around it out of the other -->
  <defs>
    <mask id="apairo-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path transform="translate(132,118) rotate(-14)" d="M-32,-48 A32,12 0 0,1 32,-48 V48 A32,12 0 0,1 -32,48 Z" fill="#000" stroke="#000" stroke-width="13" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- LEFT database (charbon): lid, upper band, lower band -->
  <g mask="url(#apairo-cut)">
    <g transform="translate(68,118) rotate(14)" fill="#2E3A48">
      <ellipse cx="0" cy="-48" rx="32" ry="12"/>
      <path d="M-32,-41.5 A32,12 0 0,0 32,-41.5 V-1.25 A32,12 0 0,1 -32,-1.25 Z"/>
      <path d="M-32,5.25 A32,12 0 0,0 32,5.25 V48 A32,12 0 0,1 -32,48 Z"/>
    </g>
  </g>

  <!-- RIGHT database (ocre) -->
  <g transform="translate(132,118) rotate(-14)" fill="#DDA42A">
    <ellipse cx="0" cy="-48" rx="32" ry="12"/>
    <path d="M-32,-41.5 A32,12 0 0,0 32,-41.5 V-1.25 A32,12 0 0,1 -32,-1.25 Z"/>
    <path d="M-32,5.25 A32,12 0 0,0 32,5.25 V48 A32,12 0 0,1 -32,48 Z"/>
  </g>

  <!-- clink spark -->
  <g stroke="#6B7A88" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="100" y1="44" x2="100" y2="26"/>
    <line x1="86" y1="48" x2="78" y2="32"/>
    <line x1="114" y1="48" x2="122" y2="32"/>
  </g>
</svg>
